<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Atelier Weather — Minimal Editorial Forecast</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{colors:{canvas:'#FAF9F5',card:'#EFE9DE',soft:'#F5F0E8',creamstrong:'#E8E0D2',ink:'#141413',body:'#3D3D3A',muted:'#6C6A64',softmuted:'#8E8B82',hairline:'#E6DFD8',coral:'#CC785C',coralactive:'#A9583E',dark:'#181715',darkel:'#252320',teal:'#5DB8A6',amber:'#E8A55A',success:'#5DB872',warn:'#D4A017',error:'#C64545'},fontFamily:{serif:['Cormorant Garamond','Tiempos Headline','Georgia','serif'],sans:['Inter','system-ui','sans-serif'],mono:['JetBrains Mono','monospace']},borderRadius:{mdx:'8px',lgx:'12px',xlx:'16px'}}}}
</script>
<style>
:root{--tint:transparent}
body{background:var(--tint),#FAF9F5;background-blend-mode:multiply;transition:background .6s ease}
.serif-d{font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:-.02em;font-weight:400}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
.skel{position:relative;overflow:hidden;background:#EFE9DE;border-radius:12px}
.skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:sh 1.4s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.range-track{height:6px;border-radius:9999px;background:#E6DFD8;position:relative;overflow:hidden}
.range-fill{position:absolute;top:0;bottom:0;border-radius:9999px;background:#141413}
.chip{background:#EFE9DE;border:1px solid #E6DFD8}
input:focus{outline:2px solid #CC785C55;outline-offset:1px}
.weather-tint-clear-day{--tint:linear-gradient(#FAF9F5,#F5F0E8)}
.weather-tint-rain{--tint:linear-gradient(#EFF2F5,#E8EDF3)}
.weather-tint-cloud{--tint:linear-gradient(#FAF9F5,#EDEBE6)}
.weather-tint-dusk{--tint:linear-gradient(#FAF6EF,#F3E6D8)}
.weather-tint-night{--tint:linear-gradient(#1F1E1B,#181715)}
.night{color-scheme:dark}
</style>
</head>
<body class="font-sans text-ink antialiased">
<div id="offline" class="hidden bg-ink text-[#FAF9F5] text-[13px] text-center py-2 px-4">You are offline — showing last saved forecast. <span class="opacity-60">Retry when connected.</span></div>
<div class="max-w-[480px] mx-auto min-h-screen px-5 pb-16">
<!-- TOP BAR -->
<header class="pt-5 flex items-center gap-2 sticky top-0 z-20 py-3" style="background:color-mix(in srgb,var(--tint) 20%, #FAF9F5)">
<div class="relative flex-1">
<input id="q" placeholder="Search city — e.g. Delhi, London" autocomplete="off" class="w-full h-10 bg-white/70 border border-hairline rounded-mdx px-4 text-[14px] placeholder:text-softmuted"/>
<div id="suggest" class="hidden absolute top-11 left-0 right-0 bg-white border border-hairline rounded-lgx shadow-lg overflow-hidden"></div>
</div>
<button id="savedBtn" title="Saved locations" class="w-10 h-10 rounded-full bg-white border border-hairline grid place-items-center">◐</button>
<button id="locBtn" title="Use my location" class="h-10 px-4 rounded-mdx bg-coral text-white text-[14px] font-medium active:bg-coralactive">Locate</button>
</header>
<div id="savedPanel" class="hidden mb-3 p-3 bg-card border border-hairline rounded-lgx"><p class="text-[12px] tracking-[1.5px] font-medium text-muted mb-2">SAVED LOCATIONS</p><div id="savedList" class="flex flex-wrap gap-2"></div></div>
<!-- HERO -->
<section id="hero" class="mt-6"></section>
<!-- HOURLY -->
<section class="mt-8"><div class="flex items-baseline justify-between mb-3"><h2 class="text-[12px] tracking-[1.5px] font-medium text-muted">HOURLY</h2><span class="text-[13px] text-softmuted">Next 24h • precip %</span></div><div id="hourly" class="flex gap-2 overflow-x-auto no-scrollbar -mx-5 px-5 pb-1"></div></section>
<!-- 7 DAY -->
<section class="mt-8"><h2 class="text-[12px] tracking-[1.5px] font-medium text-muted mb-3">7-DAY FORECAST</h2><div id="daily" class="bg-white/60 border border-hairline rounded-xlx divide-y divide-hairline overflow-hidden"></div></section>
<!-- METRICS -->
<section class="mt-8"><h2 class="text-[12px] tracking-[1.5px] font-medium text-muted mb-3">ESSENTIALS</h2><div id="metrics" class="grid grid-cols-2 gap-3"></div></section>
<footer class="mt-10 text-[13px] text-softmuted flex justify-between"><span>Open-Meteo • No key needed</span><span id="updated"></span></footer>
<!-- PERMISSION DENIED -->
<div id="denied" class="hidden mt-10 text-center border border-dashed border-hairline rounded-xlx p-8 bg-soft"><div class="mx-auto w-10 h-10 mb-3 text-muted"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg></div><h3 class="serif-d text-[28px]">Location is off</h3><p class="text-[14px] text-body mt-1 mb-4">Enable permission or search a city to continue.</p><button onclick="loadCity('New Delhi',28.6139,77.209)" class="h-10 px-5 rounded-mdx bg-ink text-white text-[14px]">Show New Delhi</button></div>
</div>
<script src="./app.js"></script>
</body>
</html>
